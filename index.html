<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simulations of an arm driven by two pneumatic muscles: equilibria, energy control, funnels and nonlinear normal modes." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Natural Motion</title>
    <script>
      // apply a stored theme before the first paint
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
